<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Orquestrador TOTVS RM — Painel Remoto</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    body { font-family: 'Segoe UI', sans-serif; background: #0f172a; color: #e2e8f0; margin: 0; padding: 20px; }
    .container { max-width: 1100px; margin: auto; }
    .card { background: #1e293b; border-radius: 8px; padding: 18px; margin-bottom: 16px; border: 1px solid #334155; }
    h1 { font-size: 20px; margin: 0 0 12px; color: #38bdf8; }
    h2 { font-size: 15px; margin: 0 0 10px; color: #94a3b8; text-transform: uppercase; }
    .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
    .list-box { max-height: 200px; overflow-y: auto; background: #0f172a; padding: 10px; border-radius: 6px; border: 1px solid #334155; }
    label { display: block; margin-bottom: 6px; font-size: 14px; cursor: pointer; }
    input[type="text"], input[type="password"], select {
      width: 100%; padding: 8px; border-radius: 5px; border: 1px solid #475569;
      background: #0f172a; color: #fff; box-sizing: border-box; margin-bottom: 10px;
    }
    .btns { display: flex; gap: 10px; flex-wrap: wrap; }
    button { padding: 10px 18px; border: none; border-radius: 6px; font-weight: 600; cursor: pointer; }
    .btn-start { background: #16a34a; color: #fff; }
    .btn-pause { background: #d97706; color: #fff; }
    .btn-stop  { background: #dc2626; color: #fff; }
    #logBox {
      background: #020617; color: #4ade80; font-family: Consolas, monospace; font-size: 13px;
      height: 320px; overflow-y: auto; padding: 12px; border-radius: 6px; border: 1px solid #334155; white-space: pre-wrap;
    }
    .badge { padding: 3px 8px; border-radius: 12px; font-size: 12px; background: #334155; }
  </style>
</head>
<body>
<div class="container">
  <div class="card">
    <h1>Orquestrador Pós-Instalação TOTVS RM <span id="statusBadge" class="badge">Aguardando</span></h1>
    <label>Servidor / Cliente Conectado:</label>
    <select id="selServidor" onchange="carregarItensServidor()"></select>
  </div>

  <div class="grid">
    <div class="card">
      <h2>Destinos de Portais</h2>
      <div id="listaPortais" class="list-box"></div>
      <div style="margin-top:10px;">
        <label><input type="checkbox" id="chkCorpore" checked> Copiar Corpore.Net (preserva web.config)</label>
        <label><input type="checkbox" id="chkFrame" checked> Copiar FrameHTML</label>
      </div>
    </div>

    <div class="card">
      <h2>Bases de Dados (Alias.dat)</h2>
      <div id="listaAliases" class="list-box"></div>
      <div style="margin-top:10px;">
        <label><input type="checkbox" id="chkAtualizador" checked> Executar Atualizador de Base</label>
        <label><input type="checkbox" id="chkAudit" checked> Executar TOTVS Audit</label>
      </div>
    </div>
  </div>

  <div class="card">
    <div class="grid">
      <div>
        <label>Usuário RM:</label>
        <input type="text" id="txtUsuario" value="rm" />
      </div>
      <div>
        <label>Senha RM:</label>
        <input type="password" id="txtSenha" placeholder="Senha do usuário RM" />
      </div>
    </div>
    <div style="margin-bottom: 12px;">
      <label style="display:inline-block; margin-right:16px;"><input type="checkbox" id="chkPararServ"> Parar serviço RM no início</label>
      <label style="display:inline-block;"><input type="checkbox" id="chkIniciarServ" checked> Iniciar serviço RM ao final</label>
    </div>
    <div class="btns">
      <button class="btn-start" onclick="iniciarExecucao()">▶ Iniciar Remotamente</button>
      <button class="btn-pause" onclick="enviarControle('PAUSAR')">⏸ Pausar</button>
      <button class="btn-start" onclick="enviarControle('RETOMAR')">⏯ Retomar</button>
      <button class="btn-stop"  onclick="enviarControle('INTERROMPER')">⏹ Interromper</button>
    </div>
  </div>

  <div class="card">
    <h2>Log de Execução ao Vivo</h2>
    <div id="logBox">Conectado ao painel. Selecione um servidor e clique em Iniciar...</div>
  </div>
</div>

<script>
  const SUPABASE_URL = "SUA_SUPABASE_URL";
  const SUPABASE_KEY = "SUA_SUPABASE_ANON_KEY";
  const db = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

  let servidores = [];
  let execucaoAtualId = null;

  async function carregarServidores() {
    const { data } = await db.from('servidores').select('*').order('nome_cliente');
    servidores = data || [];
    const sel = document.getElementById('selServidor');
    sel.innerHTML = servidores.map(s => `<option value="${s.id}">${s.nome_cliente} (${s.id})</option>`).join('');
    carregarItensServidor();
  }

  function carregarItensServidor() {
    const id = document.getElementById('selServidor').value;
    const srv = servidores.find(s => s.id === id);
    if (!srv) return;

    document.getElementById('listaPortais').innerHTML = (srv.portais_disponiveis || [])
      .map(p => `<label><input type="checkbox" class="chk-portal" value="${p}"> ${p}</label>`).join('');

    document.getElementById('listaAliases').innerHTML = (srv.aliases_disponiveis || [])
      .map(a => `<label><input type="checkbox" class="chk-alias" value="${a}"> ${a}</label>`).join('');
  }

  async function iniciarExecucao() {
    const servidorId = document.getElementById('selServidor').value;
    if (!servidorId) return alert("Nenhum servidor conectado.");

    const portais = [...document.querySelectorAll('.chk-portal:checked')].map(el => el.value);
    const aliases = [...document.querySelectorAll('.chk-alias:checked')].map(el => el.value);

    const parametros = {
      usuario_rm: document.getElementById('txtUsuario').value,
      senha_rm: document.getElementById('txtSenha').value,
      parar_servico: document.getElementById('chkPararServ').checked,
      iniciar_servico: document.getElementById('chkIniciarServ').checked,
      copiar_corpore: document.getElementById('chkCorpore').checked,
      copiar_framehtml: document.getElementById('chkFrame').checked,
      fazer_atualizar_db: document.getElementById('chkAtualizador').checked,
      fazer_audit: document.getElementById('chkAudit').checked,
      portais_selecionados: portais,
      aliases_selecionados: aliases
    };

    document.getElementById('logBox').textContent = "[Painel] Enviando ordem de execução para o servidor...\n";
    const { data, error } = await db.from('execucoes')
      .insert([{ servidor_id: servidorId, status: 'PENDENTE', parametros }])
      .select()
      .single();

    if (error) return alert("Erro ao criar execução: " + error.message);
    execucaoAtualId = data.id;
    document.getElementById('statusBadge').textContent = "PENDENTE";
    assinarLogs(execucaoAtualId);
  }

  async function enviarControle(cmd) {
    if (!execucaoAtualId) return;
    await db.from('execucoes').update({ comando_controle: cmd }).eq('id', execucaoAtualId);
  }

  function assinarLogs(execId) {
    db.channel('logs-' + execId)
      .on('postgres_changes', { event: 'INSERT', schema: 'public', table: 'logs_execucao', filter: `execucao_id=eq.${execId}` }, payload => {
        const box = document.getElementById('logBox');
        box.textContent += payload.new.mensagem + "\n";
        box.scrollTop = box.scrollHeight;
      })
      .on('postgres_changes', { event: 'UPDATE', schema: 'public', table: 'execucoes', filter: `id=eq.${execId}` }, payload => {
        document.getElementById('statusBadge').textContent = payload.new.status;
      })
      .subscribe();
  }

  carregarServidores();
</script>
</body>
</html>
